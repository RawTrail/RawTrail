# A Claude Code session's four Bash tool calls, each run the way Claude Code 2.1.296 runs one: a zsh -c whose script restores the shell
# snapshot and evals the model's command. The first runs `git status`; the second backgrounds `sleep 47` from a subshell, so zsh forks a
# copy of itself that never execs and the sleep outlives the call; the third runs `sudo id`; the fourth runs `open -a TextEdit`, and
# launchd starts TextEdit. The agent (pid 5000) is never seen, so each call's shell is a root. Every exec carries the session markers the
# production agent forwards from the environment. Every fork and exec carries the kernel generations the server resolves a creator by, and
# each call's shell leads its own process group, which keys the tool call. git's connection and lookup carry its generation, as the
# production agent's flows do, and git's index update arrives as the agent-file client folds it. Each call's Bash tool call, as the
# agent reads it from the transcript, is recorded as the call's shell forks.
name: "Claude Code session: four Bash tool calls"
host:
  id: AAAA0007-0000-0000-0000-000000000007
  hostname: dev-laptop.local
  os: macOS 26.0
timeline:
  # The Bash call the agent recorded in its transcript for this tool call (issue #1288).
  - at: 0ms
    type: agent_tool_call
    agent_session_id: 169b5bb1-29b5-41da-9a54-92cd72599ad9
    tool_use_id: toolu_e2e_git
    tool_name: Bash
    command: "git status"
    description: Show working tree status
  - at: 0ms
    type: fork
    child_pid: 5001
    parent_pid: 5000
    pidversion: 11
    parent_pidversion: 10
  - at: 2ms
    type: exec
    pid: 5001
    ppid: 5000
    pidversion: 11
    parent_pidversion: 10
    group_id: 5001
    path: /bin/zsh
    args:
      - /bin/zsh
      - -c
      - "source /Users/dev/.claude/shell-snapshots/snapshot-zsh-1.sh 2>/dev/null || true && eval 'git status' < /dev/null && pwd -P >| /tmp/claude-1a2b-cwd"
    cwd: /Users/dev/project
    uid: 501
    gid: 20
    env: &markers
      CLAUDE_CODE_SESSION_ID: 169b5bb1-29b5-41da-9a54-92cd72599ad9
      CLAUDE_PID: "5000"
      AI_AGENT: claude-code_2-1-296_agent
  - at: 5ms
    type: fork
