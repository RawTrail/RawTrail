    remote_port: 443
  # git status refreshes the index: the agent-file client reports it as one modify folding two writes (issue #1287).
  - at: 14ms
    type: file_activity
    pid: 5002
    pidversion: 21
    operation: modify
    path: /Users/dev/project/.git/index
    count: 2
    last_at: 16ms
  - at: 30ms
    type: exit
    pid: 5002
    exit_code: 0
  - at: 32ms
    type: exit
    pid: 5001
    exit_code: 0
  # The Bash call the agent recorded in its transcript for this tool call (issue #1288).
  - at: 100ms
    type: agent_tool_call
    agent_session_id: 169b5bb1-29b5-41da-9a54-92cd72599ad9
    tool_use_id: toolu_e2e_sleep
    tool_name: Bash
